name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[server,test]'
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents secure_variant_search cli.py enrichment.py simulator.py
      - name: Test
        run: python -m pytest -q
      - name: Installed CLI smoke test
        run: secure-genomic-variant-search audit --task-id CI-SYNTHETIC --target TEST

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser JavaScript
        run: |
          node --check web/app.js
          node --test tests/web.test.cjs
