services:
  secure-genomic-variant-search:
    build: .
    container_name: secure-genomic-variant-search
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a unique AUDIT_SECRET_KEY}
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN:?Set a unique API_ACCESS_TOKEN}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
