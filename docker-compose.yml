version: '3.8'

services:
  secure-genomic-variant-search:
    build: .
    container_name: secure-genomic-variant-search
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=secure-genomic-variant-search-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
