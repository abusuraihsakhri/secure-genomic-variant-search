[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-genomic-variant-search"
version = "3.0.1"
description = "SecureVariant-Search: Oblivious RAM (ORAM) Path Search over VCF Files"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
secure-genomic-variant-search = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/secure-genomic-variant-search"
Repository = "https://github.com/abusuraihsakhri/secure-genomic-variant-search.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "secure_variant_search_app"]

[tool.setuptools.packages.find]
include = ["agents*", "secure_variant_search*"]
