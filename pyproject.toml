[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-genomic-variant-search"
version = "2.0.0"
description = "SecureVariant-Search: Oblivious RAM (ORAM) Path Search over VCF Files"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
secure-genomic-variant-search = "secure_variant_search.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/secure-genomic-variant-search"
Repository = "https://github.com/abusuraihsakhri/secure-genomic-variant-search.git"
